name: Build Windows EXE

# Builds OusterLidarGUI.exe on a real Windows machine, proves it runs with
# its built-in self-test, and publishes it as a downloadable artifact.
on:
  push:
    paths:
      - "ouster_lidar_gui/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ouster_lidar_gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build OusterLidarGUI.exe
        run: python build_exe.py

      # The runner has the Visual C++ runtime installed system-wide, so a
      # passing self-test alone doesn't prove a fresh offline PC can run the
      # EXE. Verify the runtime DLLs are packed inside the EXE itself.
      - name: Check the C++ runtime is bundled
        shell: pwsh
        run: |
          $files = pyi-archive_viewer --list --brief dist\OusterLidarGUI.exe
          $dlls = $files | Where-Object { $_ -match '(?i)(msvcp140|vcruntime140)[^\\/]*\.dll\s*$' }
          "Bundled C++ runtime DLLs:"; $dlls
          $failed = $false
          foreach ($name in 'msvcp140', 'vcruntime140') {
            # plain name, or a wheel's renamed copy such as msvcp140-1a2b3c.dll
            if (-not ($dlls | Where-Object { $_ -match "(?i)(^|[\s\\/])$name(-[0-9a-f]+)?\.dll\s*$" })) {
              Write-Host "::error::$name.dll is not bundled in the EXE"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Self-test the EXE
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.txt"
          $p = Start-Process -FilePath "dist\OusterLidarGUI.exe" `
                 -ArgumentList "--self-test", $report -Wait -PassThru
          Get-Content $report
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: OusterLidarGUI-windows
          path: |
            ouster_lidar_gui/dist/OusterLidarGUI.exe
            ouster_lidar_gui/selftest.txt
          if-no-files-found: error
