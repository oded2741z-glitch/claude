<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח שחמט A4 לכיול מצלמה</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20mm;
        }

        .checkerboard {
            width: 170mm;
            height: 170mm;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 0;
            border: 2mm solid #000;
        }

        .square {
            width: 100%;
            height: 100%;
        }

        .square.white {
            background-color: #ffffff;
        }

        .square.black {
            background-color: #000000;
        }

        .title {
            margin-bottom: 10mm;
            text-align: center;
            font-size: 14px;
            color: #333;
        }

        .info {
            margin-top: 10mm;
            text-align: center;
            font-size: 10px;
            color: #666;
        }

        @media print {
            body {
                background-color: white;
                padding: 0;
                min-height: auto;
            }

            .container {
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                margin: 0;
            }

            .title {
                display: none;
            }

            .info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">לוח שחמט לכיול מצלמה - Camera Calibration Checkerboard</div>
        <div class="checkerboard" id="checkerboard"></div>
        <div class="info">8x8 Checkerboard on A4 (210mm × 297mm)</div>
    </div>

    <script>
        function createCheckerboard() {
            const checkerboard = document.getElementById('checkerboard');
            const size = 8; // 8x8 grid

            for (let row = 0; row < size; row++) {
                for (let col = 0; col < size; col++) {
                    const square = document.createElement('div');
                    square.className = 'square';

                    // Create checkerboard pattern
                    if ((row + col) % 2 === 0) {
                        square.classList.add('white');
                    } else {
                        square.classList.add('black');
                    }

                    checkerboard.appendChild(square);
                }
            }
        }

        // Create checkerboard on page load
        window.addEventListener('DOMContentLoaded', createCheckerboard);
    </script>
</body>
</html>
