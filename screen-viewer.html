<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Crect x='2' y='4' width='20' height='13' rx='2'/%3E%3Cpath d='M8 21h8M12 17v4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f9fafb">
<title>Screen Viewer</title>
<meta name="description" content="View the screen of any computer running Screen Stream.">
<style>
:root {
  --primary-accent: #2563eb;
  --primary-hover:  #1d4ed8;
  --bg-light:       #f9fafb;
  --text-dark:      #111827;
  --text-gray:      #64748b;
  --border-color:   #e2e8f0;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
html, body { height:100%; }
body { background:var(--bg-light); color:var(--text-dark); display:flex; flex-direction:column; overflow:hidden; }
header { padding:0.75rem 1.5rem; background:#ffffff; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; }
.logo-text { font-weight:800; font-size:1.5rem; letter-spacing:-0.5px; color:var(--text-dark); text-decoration:none; }
.logo-accent { color:var(--primary-accent); }
.computers { display:flex; gap:0.75rem; flex-wrap:wrap; }
.computer-btn { background:#ffffff; color:var(--text-dark); border:1px solid var(--border-color); border-radius:8px; padding:0.4rem 1rem; font-weight:700; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:0.1rem; transition:border-color 0.2s; }
.computer-btn:hover { border-color:var(--primary-accent); }
.computer-btn.active { background:var(--primary-accent); border-color:var(--primary-accent); color:#fff; }
.computer-btn small { font-size:0.75rem; font-weight:600; color:var(--text-gray); }
.computer-btn.active small { color:#fff; }
.status { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:0.9rem; font-weight:600; color:var(--text-gray); }
.dot { width:6px; height:6px; background:var(--border-color); border-radius:50%; }
.dot.live { background:#10b981; }
.screen { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.screen img { display:block; width:100%; height:100%; object-fit:contain; }
.screen .empty { color:var(--text-gray); font-size:1.05rem; }
</style>
</head>
<body>
<header>
  <a href="#" class="logo-text">Screen<span class="logo-accent">Viewer</span></a>
  <div class="computers" id="computers"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">No computer selected</span></div>
</header>

<div class="screen" id="screen">
  <span class="empty" id="empty">Select a computer above</span>
  <img id="img" alt="" style="display:none">
</div>

<script>
var COMPUTERS = [
  { name: 'Office',  address: '192.168.1.20:8080' },
  { name: 'Laptop',  address: '192.168.1.21:8080' },
  { name: 'Kitchen', address: '192.168.1.22:8080' }
];
var DELAY = 500;

var list = document.getElementById('computers');
var img = document.getElementById('img');
var empty = document.getElementById('empty');
var dot = document.getElementById('dot');
var statusText = document.getElementById('status');
var current = null;
var session = 0;
var timer = null;

function setStatus(text, live) {
  statusText.textContent = text;
  dot.className = live ? 'dot live' : 'dot';
}

function select(c, btn) {
  current = c;
  session++;
  clearTimeout(timer);
  Array.prototype.forEach.call(list.children, function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  img.style.display = 'none';
  empty.style.display = '';
  empty.textContent = 'Connecting to ' + c.name + '...';
  setStatus('Connecting to ' + c.name, false);
  load(session);
}

function load(s) {
  if (s !== session) return;
  if (document.hidden) { timer = setTimeout(function () { load(s); }, 1000); return; }
  var next = new Image();
  next.onload = function () {
    if (s !== session) return;
    img.src = next.src;
    img.style.display = '';
    empty.style.display = 'none';
    setStatus(current.name + ' - live', true);
    timer = setTimeout(function () { load(s); }, DELAY);
  };
  next.onerror = function () {
    if (s !== session) return;
    img.style.display = 'none';
    empty.style.display = '';
    empty.textContent = 'Cannot reach ' + current.name + '. Make sure Screen Stream is running there.';
    setStatus(current.name + ' - not connected, retrying', false);
    timer = setTimeout(function () { load(s); }, 2000);
  };
  next.src = 'http://' + current.address + '/frame?t=' + Date.now();
}

COMPUTERS.forEach(function (c) {
  var b = document.createElement('button');
  b.className = 'computer-btn';
  b.innerHTML = '<span></span><small></small>';
  b.firstChild.textContent = c.name;
  b.lastChild.textContent = c.address;
  b.onclick = function () { select(c, b); };
  list.appendChild(b);
});
</script>
</body>
</html>
