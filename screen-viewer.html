<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Crect x='2' y='4' width='20' height='13' rx='2'/%3E%3Cpath d='M8 21h8M12 17v4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f9fafb">
<title>Screen Viewer</title>
<meta name="description" content="View the screen of any computer running Screen Stream.">
<style>
:root {
  --primary-accent: #2563eb;
  --primary-hover:  #1d4ed8;
  --bg-light:       #f9fafb;
  --text-dark:      #111827;
  --text-gray:      #64748b;
  --border-color:   #e2e8f0;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
html, body { height:100%; }
body { background:var(--bg-light); color:var(--text-dark); display:flex; flex-direction:column; overflow:hidden; }
header { padding:0.3rem 1rem; background:#ffffff; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
.logo-text { font-weight:800; font-size:1.1rem; letter-spacing:-0.5px; color:var(--text-dark); text-decoration:none; }
.logo-accent { color:var(--primary-accent); }
.computers { display:flex; gap:0.5rem; flex-wrap:wrap; }
.computer-btn { background:#ffffff; color:var(--text-dark); border:1px solid var(--border-color); border-radius:8px; padding:0.2rem 0.75rem; font-size:0.85rem; font-weight:700; cursor:pointer; text-align:left; display:flex; align-items:baseline; gap:0.5rem; transition:border-color 0.2s; }
.computer-btn:hover { border-color:var(--primary-accent); }
.computer-btn.active { background:var(--primary-accent); border-color:var(--primary-accent); color:#fff; }
.computer-btn small { font-size:0.75rem; font-weight:600; color:var(--text-gray); }
.computer-btn.active small { color:#fff; }
.status { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:0.85rem; font-weight:600; color:var(--text-gray); }
.dot { width:6px; height:6px; background:var(--border-color); border-radius:50%; }
.dot.live { background:#10b981; }
.reset-btn { display:none; background:#ffffff; color:var(--text-dark); border:1px solid var(--border-color); border-radius:8px; padding:0.2rem 0.75rem; font-size:0.85rem; font-weight:700; cursor:pointer; transition:border-color 0.2s; }
.reset-btn:hover { border-color:var(--primary-accent); }
.screen { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; user-select:none; }
.screen canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.screen canvas.selectable { cursor:crosshair; }
.screen .empty { position:relative; color:var(--text-gray); font-size:1.05rem; }
.select-box { position:absolute; display:none; border:2px solid var(--primary-accent); background:rgba(37,99,235,0.15); pointer-events:none; }
</style>
</head>
<body>
<header>
  <a href="#" class="logo-text">Screen<span class="logo-accent">Viewer</span></a>
  <div class="computers" id="computers"></div>
  <button class="reset-btn" id="reset">Reset zoom</button>
  <div class="status"><span class="dot" id="dot"></span><span id="status">No computer selected</span></div>
</header>

<div class="screen" id="screen">
  <span class="empty" id="empty">Select a computer above</span>
  <canvas id="canvas"></canvas>
  <div class="select-box" id="box"></div>
</div>

<script>
var COMPUTERS = [
  { name: 'Office',  address: '192.168.1.20:8080' },
  { name: 'Laptop',  address: '192.168.1.21:8080' },
  { name: 'Kitchen', address: '192.168.1.22:8080' }
];
var DELAY = 500;

var list = document.getElementById('computers');
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var box = document.getElementById('box');
var resetBtn = document.getElementById('reset');
var frame = null;
var crop = null;
var map = { x: 0, y: 0, s: 1, sx: 0, sy: 0 };
var start = null;
var empty = document.getElementById('empty');
var dot = document.getElementById('dot');
var statusText = document.getElementById('status');
var current = null;
var session = 0;
var timer = null;

function setStatus(text, live) {
  statusText.textContent = text;
  dot.className = live ? 'dot live' : 'dot';
}

function draw() {
  var dpr = window.devicePixelRatio || 1;
  var cw = canvas.clientWidth, ch = canvas.clientHeight;
  if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  canvas.className = frame && !crop ? 'selectable' : '';
  if (!frame) return;
  var sx = 0, sy = 0, sw = frame.naturalWidth, sh = frame.naturalHeight;
  if (crop) { sx = crop.x; sy = crop.y; sw = crop.w; sh = crop.h; }
  var s = Math.min(cw / sw, ch / sh);
  var dw = sw * s, dh = sh * s, dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(frame, sx, sy, sw, sh, dx * dpr, dy * dpr, dw * dpr, dh * dpr);
  map = { x: dx, y: dy, s: s, sx: sx, sy: sy };
}

function setCrop(c) {
  crop = c;
  resetBtn.style.display = c ? 'block' : 'none';
  draw();
}

function point(e) {
  var r = canvas.getBoundingClientRect();
  return { x: Math.max(0, Math.min(r.width, e.clientX - r.left)), y: Math.max(0, Math.min(r.height, e.clientY - r.top)) };
}

canvas.addEventListener('mousedown', function (e) {
  if (e.button !== 0 || !frame || crop) return;
  start = point(e);
  box.style.left = start.x + 'px';
  box.style.top = start.y + 'px';
  box.style.width = '0px';
  box.style.height = '0px';
  box.style.display = 'block';
  e.preventDefault();
});

window.addEventListener('mousemove', function (e) {
  if (!start) return;
  var p = point(e);
  box.style.left = Math.min(start.x, p.x) + 'px';
  box.style.top = Math.min(start.y, p.y) + 'px';
  box.style.width = Math.abs(p.x - start.x) + 'px';
  box.style.height = Math.abs(p.y - start.y) + 'px';
});

window.addEventListener('mouseup', function (e) {
  if (!start) return;
  var p = point(e);
  var a = start;
  start = null;
  box.style.display = 'none';
  if (!frame || Math.abs(p.x - a.x) < 10 || Math.abs(p.y - a.y) < 10) return;
  var iw = frame.naturalWidth, ih = frame.naturalHeight;
  var x1 = Math.max(0, Math.min(iw, map.sx + (Math.min(a.x, p.x) - map.x) / map.s));
  var y1 = Math.max(0, Math.min(ih, map.sy + (Math.min(a.y, p.y) - map.y) / map.s));
  var x2 = Math.max(0, Math.min(iw, map.sx + (Math.max(a.x, p.x) - map.x) / map.s));
  var y2 = Math.max(0, Math.min(ih, map.sy + (Math.max(a.y, p.y) - map.y) / map.s));
  if (x2 - x1 < 2 || y2 - y1 < 2) return;
  setCrop({ x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
});

resetBtn.onclick = function () { setCrop(null); };
window.addEventListener('resize', draw);

function select(c, btn) {
  current = c;
  session++;
  clearTimeout(timer);
  Array.prototype.forEach.call(list.children, function (b) { b.classList.remove('active'); });
  btn.classList.add('active');
  frame = null;
  setCrop(null);
  empty.style.display = '';
  empty.textContent = 'Connecting to ' + c.name + '...';
  setStatus('Connecting to ' + c.name, false);
  load(session);
}

function load(s) {
  if (s !== session) return;
  if (document.hidden) { timer = setTimeout(function () { load(s); }, 1000); return; }
  var next = new Image();
  next.onload = function () {
    if (s !== session) return;
    frame = next;
    draw();
    empty.style.display = 'none';
    setStatus(current.name + ' - live', true);
    timer = setTimeout(function () { load(s); }, DELAY);
  };
  next.onerror = function () {
    if (s !== session) return;
    frame = null;
    draw();
    empty.style.display = '';
    empty.textContent = 'Cannot reach ' + current.name + '. Make sure Screen Stream is running there.';
    setStatus(current.name + ' - not connected, retrying', false);
    timer = setTimeout(function () { load(s); }, 2000);
  };
  next.src = 'http://' + current.address + '/frame?t=' + Date.now();
}

COMPUTERS.forEach(function (c) {
  var b = document.createElement('button');
  b.className = 'computer-btn';
  b.innerHTML = '<span></span><small></small>';
  b.firstChild.textContent = c.name;
  b.lastChild.textContent = c.address;
  b.onclick = function () { select(c, b); };
  list.appendChild(b);
});
</script>
</body>
</html>
