<title>Static Response</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root {
  --void: #050605;
  --glass: #0b0d0b;
  --bezel: #1b1c19;
  --phosphor: #d9dccf;
  --dim: #7d8276;
  --blood: #c8161d;
  --ok: #8fd3a8;
  --display: "VT323", "Courier New", monospace;
  --body: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--phosphor);
  font-family: var(--body);
  display: flex;
  align-items: center;
  justify-content: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#crt {
  position: relative;
  width: min(100%, calc((100dvh - 32px) * 16 / 9));
  aspect-ratio: 16 / 9;
  max-width: 100%;
  background: var(--glass);
  border: 3px solid var(--bezel);
  border-radius: 28px / 36px;
  overflow: hidden;
  box-shadow: 0 0 0 10px #0a0a09, 0 0 60px rgba(217, 220, 207, 0.06), inset 0 0 80px rgba(0, 0, 0, 0.9);
  transition: border-color 120ms;
  cursor: pointer;
}
@media (max-aspect-ratio: 1/1) {
  #crt { aspect-ratio: 3 / 4; width: min(100%, calc((100dvh - 32px) * 3 / 4)); }
}
#crt.hit { border-color: var(--blood); }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fx { position: absolute; inset: 0; pointer-events: none; }
.scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px); }
.vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.85) 100%); }
.roll {
  background: linear-gradient(to bottom, transparent 0%, rgba(217,220,207,0.05) 55%, rgba(217,220,207,0.16) 92%, rgba(240,242,232,0.55) 97%, rgba(217,220,207,0.08) 100%);
  height: 22%;
  top: 0;
  bottom: auto;
  mix-blend-mode: screen;
  animation: roll 6s linear infinite;
  z-index: 1;
}
#rollNoise {
  position: absolute;
  inset: 0;
  background-size: 220px 70px;
  image-rendering: pixelated;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.35) 50%, #000 90%, #000 97%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.35) 50%, #000 90%, #000 97%, transparent 100%);
}
@keyframes roll { from { transform: translateY(-100%); } to { transform: translateY(460%); } }
#hud {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: clamp(10px, 3%, 28px) clamp(14px, 4%, 40px);
  font-family: var(--display);
  font-size: clamp(14px, 2.4vmin, 24px);
  letter-spacing: 0.06em;
  pointer-events: none;
}
#hud[hidden] { display: none !important; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.strikes { display: flex; gap: 6px; }
.strikes i {
  width: 0.9em; height: 0.9em;
  border: 1px solid var(--dim);
  display: inline-block;
}
.strikes i.on { background: var(--blood); border-color: var(--blood); }
#bar { height: 3px; background: rgba(217,220,207,0.12); margin-top: 6px; }
#bar div { height: 100%; width: 0; background: var(--dim); }
#feedback { min-height: 1.2em; text-align: center; }
#feedback.ok { color: var(--ok); }
#feedback.bad { color: var(--blood); }
.foot { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--dim); text-align: center; }
#panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2vmin, 18px);
  padding: 6% 8%;
  text-align: center;
  overflow-y: auto;
}
#panel h1 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(36px, 9vmin, 96px);
  letter-spacing: 0.12em;
  margin: 0;
  line-height: 1;
  text-shadow: 0 0 12px rgba(217,220,207,0.35);
  text-wrap: balance;
}
#panel h2 {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(26px, 6vmin, 64px);
  letter-spacing: 0.08em;
  margin: 0;
  text-shadow: 0 0 10px rgba(217,220,207,0.3);
  text-wrap: balance;
}
#panel p { margin: 0; max-width: 60ch; font-size: clamp(11px, 1.9vmin, 16px); line-height: 1.55; }
#panel ol { margin: 0; padding-left: 1.6em; text-align: left; font-size: clamp(11px, 1.9vmin, 16px); line-height: 1.6; }
#panel .warn { color: var(--blood); font-family: var(--display); font-size: clamp(14px, 2.6vmin, 24px); letter-spacing: 0.08em; }
#panel .muted { color: var(--dim); }
#panel button {
  font-family: var(--display);
  font-size: clamp(18px, 3.4vmin, 32px);
  letter-spacing: 0.12em;
  background: transparent;
  color: var(--phosphor);
  border: 1px solid var(--phosphor);
  padding: 0.25em 1.2em;
  cursor: pointer;
}
#panel button:hover, #panel button:focus-visible { background: var(--phosphor); color: var(--void); outline: none; }
.stats { display: grid; grid-template-columns: auto auto; gap: 4px 24px; font-family: var(--display); font-size: clamp(16px, 3vmin, 28px); font-variant-numeric: tabular-nums; }
.stats span:nth-child(odd) { color: var(--dim); text-align: right; }
.stats span:nth-child(even) { text-align: left; }
.answers, .stagepick { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center; }
.answers[hidden] { display: none !important; }
#panel button.small { font-size: clamp(13px, 2.2vmin, 20px); padding: 0.15em 0.8em; border-color: var(--dim); color: var(--dim); }
#panel button:disabled { opacity: 0.4; cursor: default; }
.eyeWrap {
  width: min(50%, 480px);
  max-width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  margin-bottom: 18px;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
  mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 62%, transparent 100%);
  animation: eyeFade 1.2s ease-out, blink 4.6s ease-in-out 1.4s infinite;
}
.eyeWrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: grayscale(1) contrast(1.2) brightness(0.9);
  animation: dart 5s ease-in-out infinite;
}
@keyframes eyeFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(0.03); } }
@keyframes dart {
  0%, 18% { transform: scale(1.06) translate(0, 0); }
  21%, 40% { transform: scale(1.06) translate(-2.5%, 1%); }
  43%, 62% { transform: scale(1.06) translate(2%, -1%); }
  65%, 82% { transform: scale(1.06) translate(-1%, -1.5%); }
  85%, 100% { transform: scale(1.06) translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) { .eyeWrap, .eyeWrap img { animation: none; } }
#peek {
  position: absolute;
  left: 50%;
  top: 50%;
  height: 92%;
  aspect-ratio: 783 / 1000;
  transform: translate(-50%, -50%) scale(0.92);
  opacity: 0;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 70%, transparent 100%);
  mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 70%, transparent 100%);
  filter: grayscale(1) brightness(0.7) contrast(1.2);
  pointer-events: none;
}
#peek.flash { opacity: 0.9; transform: translate(-50%, -50%) scale(1.05); filter: grayscale(1) brightness(0.95) contrast(1.4); }
#peek.p3 { opacity: 1; transform: translate(-50%, -50%) scale(1.18); filter: grayscale(1) brightness(0.9) contrast(1.3); }
.storyBlock { display: flex; flex-direction: column; gap: 0.55em; align-items: center; }
#panel { justify-content: safe center; }
@media (max-aspect-ratio: 1/1) { #panel p.story { font-size: clamp(11px, 3.3vw, 18px); } .storyBlock { gap: 0.45em; } }
#panel p.story.last { color: var(--blood); text-shadow: 0 0 10px rgba(200,22,29,0.6), 0 0 6px #000; margin-top: 0.4em; }
#handX {
  position: absolute;
  left: 50%;
  top: 50%;
  height: 96%;
  aspect-ratio: 514 / 1000;
  transform: translate(-50%, -50%);
  opacity: 0;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 65%, transparent 100%);
  mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 65%, transparent 100%);
  filter: contrast(1.2);
  pointer-events: none;
}
#handX.slam { opacity: 0.9; animation: slam 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
#handX.slam.sway { animation: sway 1.6s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: translate(-50%, -50%); } 25% { transform: translate(-85%, -50%); } 75% { transform: translate(-15%, -50%); } }
@keyframes slam { 0% { transform: translate(-50%, -50%) scale(1.45); opacity: 0; filter: contrast(1.2) brightness(2); } 50% { opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); filter: contrast(1.2) brightness(1); } }
#panel #sub, #panel #qtext { text-shadow: 0 0 6px #000, 0 0 12px #000, 0 0 2px #000; }
#panel #sub { color: var(--phosphor); }
#walker {
  position: absolute;
  left: 50%;
  top: 50%;
  height: 100%;
  aspect-ratio: 460 / 720;
  transform: translate(-50%, -50%);
  mix-blend-mode: screen;
}
#walker video { width: 100%; height: 100%; display: block; filter: contrast(1.15); }
#introClown {
  position: absolute;
  right: 3%;
  bottom: 2%;
  height: 82%;
  aspect-ratio: 460 / 720;
  mix-blend-mode: screen;
  opacity: 0.85;
  filter: contrast(1.1);
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 75%, transparent 100%);
  mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 75%, transparent 100%);
  pointer-events: none;
}
@media (max-aspect-ratio: 1/1) { #introClown { right: -12%; opacity: 0.35; } }
@media (min-aspect-ratio: 1/1) { #panel.withSide { padding-left: 4%; padding-right: 30%; } }
#rlgl { position: absolute; inset: 0; pointer-events: none; }
#rlglVid { position: absolute; left: 50%; top: 2%; height: 96%; aspect-ratio: 540 / 960; transform: translateX(-50%) scale(0.42); transform-origin: 50% 70%; mix-blend-mode: screen; }
#rlglBar { position: absolute; left: 6%; right: 6%; bottom: 4%; height: 4px; background: rgba(217,220,207,0.15); }
#rlglBar div { height: 100%; width: 0; background: var(--phosphor); }
#rlglInfo { position: absolute; left: 0; right: 0; bottom: 7%; text-align: center; font-family: var(--display); font-size: clamp(16px, 3vmin, 28px); letter-spacing: 0.1em; color: var(--phosphor); text-shadow: 0 0 6px #000; }
#rlglInfo.stop { color: var(--blood); }
#mazeCv { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
#panel p.story {
  font-family: var(--display);
  font-size: clamp(15px, 3.1vmin, 32px);
  letter-spacing: 0.05em;
  line-height: 1.2;
  max-width: 56ch;
  margin: 0;
  min-height: 1.2em;
  text-shadow: 0 0 6px #000, 0 0 12px #000;
}
.wall {
  position: absolute;
  inset: 0;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 0.2em 0.9em;
  padding: 3%;
  overflow: hidden;
  font-family: var(--display);
  font-size: clamp(16px, 3.4vmin, 34px);
  color: var(--blood);
  letter-spacing: 0.06em;
  text-shadow: 0 0 8px rgba(200,22,29,0.6);
  animation: wallFlicker 0.12s steps(2) infinite;
}
@keyframes wallFlicker { 50% { opacity: 0.8; } }
#scareVid { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
#scare { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 50; display: block; background: #000; }
#scare[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .roll { animation: none; } }
</style>

<div id="crt">
  <canvas id="scene"></canvas>
  <div class="fx roll"><div id="rollNoise"></div></div>
  <div id="hud" hidden>
    <div>
      <div class="row">
        <span id="lvl">LEVEL 1 / 10</span>

</div>

<script>
const $ = s => document.querySelector(s);
const crt = $('#crt'), scene = $('#scene'), ctx = scene.getContext('2d');
const scareCv = $('#scare'), sctx = scareCv.getContext('2d');
const panel = $('#panel'), hud = $('#hud'), feedbackEl = $('#feedback'), clockEl = $('#clock');
const LEVELS = 10;
let W = 1, H = 1, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = scene.getBoundingClientRect();
  W = Math.max(1, Math.floor(r.width));
  H = Math.max(1, Math.floor(r.height));
  scene.width = W * DPR; scene.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  scareCv.width = innerWidth * DPR; scareCv.height = innerHeight * DPR;
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize);
resize();

const noiseFrames = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement('canvas');
  c.width = 220; c.height = 124;
  const g = c.getContext('2d');
  const img = g.createImageData(c.width, c.height);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  noiseFrames.push(c);
}
const rollNoiseEl = document.getElementById('rollNoise');
const rollFrames = [];
for (let k = 0; k < 8; k++) {
  const c = document.createElement('canvas');
  c.width = 220; c.height = 70;
  const g = c.getContext('2d');
  const img = g.createImageData(c.width, c.height);
  for (let y = 0; y < c.height; y++) {
    const streak = Math.random() < 0.12 ? 1.8 : 1;
    for (let x = 0; x < c.width; x++) {
      const i = (y * c.width + x) * 4;
      const v = 160 + Math.random() * 95;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = Math.min(255, Math.random() * 120 * streak);
    }
  }
  g.putImageData(img, 0, 0);
  rollFrames.push(`url(${c.toDataURL()})`);
}
const calmMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let shakeDir = 1, shakeBoost = 1;
if (!calmMotion) {
  setInterval(() => {
    shakeDir = -shakeDir;
    const x = (shakeDir * (1 + Math.random() * 1.2) * shakeBoost).toFixed(2);
    crt.style.transform = `translateX(${x}px)`;
  }, 28);
}
function glitchShift() {
  if (!panel.hidden) {
    const els = [...panel.querySelectorAll('li, p, h1, h2, .stats, .answers')];
    if (els.length) {
      const start = Math.floor(Math.random() * els.length);
      const block = els.slice(start, start + 1 + Math.floor(Math.random() * 3));
      const dx = Math.round(20 + Math.random() * 50);
      block.forEach(el => { el.style.transform = `translateX(${dx}px)`; el.style.filter = 'brightness(1.4)'; });
      setTimeout(() => block.forEach(el => { el.style.transform = ''; el.style.filter = ''; }), 120 + Math.random() * 160);
    }
  }
  setTimeout(glitchShift, 2000 + Math.random() * 3000);
}
if (!calmMotion) setTimeout(glitchShift, 2500);
let rollIdx = 0;
setInterval(() => {
  rollIdx = (rollIdx + 1) % rollFrames.length;
  rollNoiseEl.style.backgroundImage = rollFrames[rollIdx];
  rollNoiseEl.style.transform = `translateX(${(Math.random() * 6 - 3).toFixed(1)}px)`;
}, 60);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

function drawNoise(g, w, h, alpha) {
  g.save();
  g.globalAlpha = alpha;
  g.imageSmoothingEnabled = false;
  g.drawImage(pick(noiseFrames), 0, 0, w, h);
  g.restore();
}

let AC = null, master = null, noiseBuf = null, drone = null;
function initAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = 0.85;
    const comp = AC.createDynamicsCompressor();
    master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
}
function noiseSrc() { const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s; }
function env(g, t, peak, a, hold, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + a + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
}
function startDrone() {
  if (drone) return;
  const out = AC.createGain(); out.gain.value = 0; out.connect(master);
  out.gain.linearRampToValueAtTime(0.025, AC.currentTime + 2);
  const o1 = AC.createOscillator(), o2 = AC.createOscillator();
  o1.frequency.value = 47; o2.frequency.value = 47.6;
  const n = noiseSrc(), lp = AC.createBiquadFilter(), ng = AC.createGain();
  lp.type = 'lowpass'; lp.frequency.value = 300; ng.gain.value = 0.25;
  o1.connect(out); o2.connect(out); n.connect(lp); lp.connect(ng); ng.connect(out);
  o1.start(); o2.start(); n.start();
  const nodes = [o1, o2, n];
  const hg = AC.createGain(); hg.gain.value = 0; hg.connect(master);
  if (heartBuf) {
    const hb = AC.createBufferSource();
    hb.buffer = heartBuf; hb.loop = true;
    hb.connect(hg); hb.start();
    hg.gain.linearRampToValueAtTime(0.22, AC.currentTime + 1.5);
    nodes.push(hb);
  }
  if (ambientBuf) {
    const ab = AC.createBufferSource(), ag = AC.createGain();
    ab.buffer = ambientBuf; ab.loop = true;
    ag.gain.value = 0.6;
    ab.connect(ag); ag.connect(hg); ab.start();
    nodes.push(ab);
  }
  drone = { out, hg, nodes };
}
function stopDrone() {
  if (!drone) return;
  const d = drone; drone = null;
  d.out.gain.setTargetAtTime(0, AC.currentTime, 0.3);
  d.hg.gain.setTargetAtTime(0, AC.currentTime, 0.3);
  d.nodes.forEach(n => n.stop(AC.currentTime + 1.5));
}
function cueKnock(v) {
  const t = AC.currentTime;
  for (let i = 0; i < 3; i++) {
    const tt = t + i * 0.2;
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(110, tt);
    o.frequency.exponentialRampToValueAtTime(40, tt + 0.15);
    env(g, tt, 0.9 * v, 0.004, 0.02, 0.18);
    o.connect(g); g.connect(master); o.start(tt); o.stop(tt + 0.3);
    const n = noiseSrc(), f = AC.createBiquadFilter(), ng = AC.createGain();
    f.type = 'lowpass'; f.frequency.value = 900;
    env(ng, tt, 0.4 * v, 0.002, 0.01, 0.06);
    n.connect(f); f.connect(ng); ng.connect(master); n.start(tt); n.stop(tt + 0.15);
  }
}
function cueWhisper(v) {
  const t = AC.currentTime;
  const n = noiseSrc(), f = AC.createBiquadFilter(), g = AC.createGain();
  f.type = 'bandpass'; f.frequency.value = rand(2000, 3400); f.Q.value = 1.4;
  g.gain.setValueAtTime(0.0001, t);
  let tt = t;
  for (let i = 0; i < 5; i++) {
    g.gain.linearRampToValueAtTime(rand(0.5, 0.9) * v, tt + 0.06);
    g.gain.linearRampToValueAtTime(0.05 * v, tt + rand(0.14, 0.22));
    tt += rand(0.16, 0.26);
  }
  g.gain.linearRampToValueAtTime(0.0001, tt + 0.1);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(tt + 0.2);
}
function cueTone(v) {
  const t = AC.currentTime;
  const base = pick([660, 740, 880, 990]);
  [base, base * 1.008].forEach(fr => {

function buildLevel(n) {
  const D = 81000;
  const count = Math.round(D / Math.max(6000, 12000 - n * 600));
  const win = Math.max(650, 1700 - n * 105);
  const vis = Math.max(160, 520 - n * 35);
  const slot = (D - 2500) / count;
  const evs = [];
  for (let i = 0; i < count; i++) {
    const t = 1500 + i * slot + Math.random() * Math.max(0, slot - win - 700);
    evs.push({ t, kind: 'chain', win, dur: vis, state: 'pending', img: null, zoom: rand(1, 1.08) });
  }
  if (n === game.scareLevel) evs[1 + Math.floor(Math.random() * (count - 2))].kind = 'scare';
  return { n, D, evs, gt: 0, strikes: 0, active: null, grace: 0, busy: 0, vol: Math.max(0.35, 1 - n * 0.065), resolve: null, done: false };
}

function update(dt) {
  const lv = game.lv;
  if (lv.done) return;
  lv.gt += dt;
  $('#bar div').style.width = Math.min(100, lv.gt / lv.D * 100) + '%';
  if (lv.active && lv.gt - lv.active.start > lv.active.win) {
    const ev = lv.active;
    ev.state = 'missed';
    lv.active = null;
    game.misses++;
    if (ev.stage === 1) { hideWalker(); game.caught = true; finishLevel(false); return; }
    game.chain = 1;
    feedback('IT IS GETTING CLOSER', 'bad');
  }
  for (const ev of lv.evs) {
    if (ev.state !== 'pending' || lv.gt < ev.t) continue;
    if (lv.active) { ev.t = lv.gt + 400; continue; }
    if (lv.gt < lv.busy) { ev.t = lv.busy + 300; continue; }
    if (ev.kind === 'scare') {
      ev.state = 'done';
      game.paused = true;
      stopDrone();
      jumpscare().then(() => {
        lv.grace = lv.gt + 900;
        startDrone();
        game.paused = false;
      });
      return;
    }
    ev.state = 'active';
    ev.start = lv.gt;
    lv.active = ev;
    ev.stage = game.chain;
    if (ev.stage === 0) {
      playSteps(lv.vol);
      ev.win = stepsBuf ? stepsBuf.duration * 1000 : ev.win;
      lv.busy = lv.gt + ev.win;
    }
    else {
      const rate = 1 + (lv.n - 1) * 0.05;
      ev.win = 5030 / rate;
      showWalker(rate);
    }
    break;
  }
  if (!lv.active && lv.gt >= lv.D) finishLevel(true);
}

  'Look at the dark glass. Just behind your shoulder.',
  'He always used to smile and say, "Now it\'s just you and me."',
  'He said it every time another child from your class stopped coming to school.',
  'There is no one left now.',
  'Only you.'
];
const STORY_LAST = '"I saved my best friend for last."';

async function peekFlash() {
  const peek = $('#peek');
  peek.className = 'flash';
  await wait(500);
  peek.className = '';
}

const narrData = ['audio/story1.mp3', 'audio/story2.mp3'].map(u => fetch(u).then(r => r.ok ? r.arrayBuffer() : null).catch(() => null));
let narrBufs = [null, null];
async function loadNarration() {
  if (narrBufs[0] || !AC) return;
  const data = await Promise.all(narrData);
  narrBufs = await Promise.all(data.map(d => d ? AC.decodeAudioData(d.slice(0)).catch(() => null) : null));
}

function playNarration(buf) {
  if (!AC || !buf) return null;
  const src = AC.createBufferSource(), g = AC.createGain();
  src.buffer = buf;
  g.gain.value = 1.3;
  src.connect(g); g.connect(master);
  src.start();
  if (drone) {
    drone.out.gain.setTargetAtTime(0.01, AC.currentTime, 0.4);
    drone.hg.gain.setTargetAtTime(0.08, AC.currentTime, 0.4);
  }
  return { src, g };
}

function stopNarration(n) {
  if (n) {
    n.g.gain.setTargetAtTime(0, AC.currentTime, 0.1);
    n.src.stop(AC.currentTime + 0.5);
  }
  if (drone) {
    drone.out.gain.setTargetAtTime(0.025, AC.currentTime, 0.6);
    drone.hg.gain.setTargetAtTime(0.22, AC.currentTime, 0.6);
  }
}

async function stageStory() {
  const peek = $('#peek');
  peek.className = '';
  await loadNarration();
  const lines = arr => arr.map(l => `<p class="story">${l}</p>`).join('');
  showPanel(`<div class="storyBlock">${lines(STORY_SAD)}</div><div class="answers" id="answers" hidden><button type="button">CONTINUE</button></div>`);
  const n1 = playNarration(narrBufs[0]);
  await wait(n1 ? narrBufs[0].duration * 1000 : 5000);
  await waitDone($('#answers'));
  stopNarration(n1);
  hidePanel();
  await wait(1200);
  showPanel(`<div class="storyBlock">${lines(STORY_DARK)}<p class="story last">${STORY_LAST}</p></div>`);
  const n2 = playNarration(narrBufs[1]);
  if (n2) {
    await wait(23800);
    await peekFlash();
    await wait(26200);
    await peekFlash();
    await wait(Math.max(0, narrBufs[1].duration * 1000 - 50500));
  } else {
    await wait(5000);
    await peekFlash();
    await wait(6000);
    await peekFlash();
    await wait(5000);
  }
  stopNarration(null);
  const words = Array(160).fill('<span>YOU LET HIM IN</span>').join('');
  showPanel(`<div class="wall">${words}</div>`);
  peek.className = 'p3';
  if (AC) cueWhisper(0.9);
  await wait(4500);
  hidePanel();
  peek.className = '';
  await wait(2600);
  return true;
}

async function stageReaction() {
  for (let n = 1; n <= LEVELS; n++) {
    game.level = n;
    hud.hidden = true;
    showPanel(`<h2>LEVEL ${n}</h2><p class="muted">Eyes on the screen.</p>`);
    await wait(2200);
    hidePanel();
    const ok = await playLevel(n);
    game.lv = null;
    hud.hidden = true;
    if (!ok) return false;
    showPanel(`<h2>LEVEL ${n} COMPLETED</h2>`);
    await wait(2000);
    if (n < LEVELS) {
      for (let s = 5; s > 0; s--) {
        showPanel(`<h2>LEVEL ${n} COMPLETED</h2><p>The next level begins in ${s} second${s > 1 ? 's' : ''}</p>`);
        await wait(1000);
      }
    }
  }
  return true;
}

const MAZES = [
  { w: 1.2, pts: [[1, 1.5], [14, 1.5], [14, 4.5], [2, 4.5], [2, 7.5], [15, 7.5]] },
  { w: 0.8, pts: [[1, 1], [6, 1], [6, 4], [3, 4], [3, 8], [9, 8], [9, 2], [13, 2], [13, 6], [15, 6]] },
  { w: 0.45, pts: [[1, 8], [1, 1], [4, 1], [4, 6], [6, 6], [6, 1.5], [8.5, 1.5], [8.5, 7.5], [11, 7.5], [11, 3], [12.5, 3], [12.5, 5.5], [13.8, 5.5], [13.8, 1], [15.2, 1]] }
];

function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function runMaze(m, index) {
  return new Promise(res => {
    const cv = $('#mazeCv'), g = cv.getContext('2d');
    let sc = 1, ox = 0, oy = 0, state = 'waiting', last = null, pulse = 0, raf = 0;
    const start = m.pts[0], exit = m.pts[m.pts.length - 1];
    const size = () => {
      const r = cv.getBoundingClientRect();
      cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR);
      sc = Math.min(r.width / 16, r.height / 9);
      ox = (r.width - 16 * sc) / 2; oy = (r.height - 9 * sc) / 2;
    };
    const toUnits = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left - ox) / sc, (e.clientY - r.top - oy) / sc];
    };
    const inside = (x, y) => {
      for (let i = 0; i < m.pts.length - 1; i++) {
        const a = m.pts[i], b = m.pts[i + 1];
        if (segDist(x, y, a[0], a[1], b[0], b[1]) <= m.w / 2) return true;
      }
      return false;
    };
    const draw = () => {
      const w = cv.width / DPR, h = cv.height / DPR;
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      g.fillStyle = '#b9bcb0'; g.fillRect(0, 0, w, h);
      drawNoise(g, w, h, 0.18);
      g.save();
      g.translate(ox, oy); g.scale(sc, sc);
      g.strokeStyle = '#050605'; g.lineWidth = m.w; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); m.pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
      pulse += 0.06;
      g.fillStyle = state === 'waiting' ? `rgba(240,242,232,${0.7 + 0.25 * Math.sin(pulse)})` : 'rgba(217,220,207,0.15)';
      g.beginPath(); g.arc(start[0], start[1], m.w / 2, 0, Math.PI * 2); g.fill();
      g.fillStyle = `rgba(200,22,29,${0.55 + 0.25 * Math.sin(pulse * 1.3)})`;
      g.beginPath(); g.arc(exit[0], exit[1], m.w / 2, 0, Math.PI * 2); g.fill();
      g.restore();
      g.fillStyle = '#050605';
      g.font = `${Math.max(12, Math.round(sc * 0.32))}px VT323, monospace`;
      g.textAlign = 'center';
      g.fillText(state === 'waiting' ? `MAZE ${index + 1} / 3   MOVE THE CURSOR INTO THE LIGHT CIRCLE TO BEGIN` : `MAZE ${index + 1} / 3   REACH THE RED CIRCLE. DO NOT TOUCH THE WALLS.`, w / 2, oy + sc * 0.45);
      raf = requestAnimationFrame(draw);
    };
    const finish = ok => {
      if (state === 'done') return;
      state = 'done';
      cancelAnimationFrame(raf);
      cv.removeEventListener('pointermove', move);
      cv.removeEventListener('pointerleave', leave);
      removeEventListener('resize', size);
      cv.hidden = true;
      res(ok);
    };
    const move = e => {
      const [x, y] = toUnits(e);
      if (state === 'waiting') {
        if (Math.hypot(x - start[0], y - start[1]) <= m.w / 2) { state = 'tracking'; last = [x, y]; }
        return;
      }
      if (state !== 'tracking') return;
      const steps = Math.max(1, Math.ceil(Math.hypot(x - last[0], y - last[1]) / (2 / sc)));
      for (let k = 1; k <= steps; k++) {
        const px = last[0] + (x - last[0]) * k / steps, py = last[1] + (y - last[1]) * k / steps;
        if (!inside(px, py)) { game.failMsg = `You touched the wall in maze ${index + 1}.`; finish(false); return; }
        if (Math.hypot(px - exit[0], py - exit[1]) <= m.w / 2) { finish(true); return; }
      }
      last = [x, y];
    };
    const leave = () => {
      if (state === 'tracking') { game.failMsg = `You left the maze in maze ${index + 1}.`; finish(false); }
    };
    cv.hidden = false;
    size();
    addEventListener('resize', size);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerleave', leave);
    draw();
  });
}

async function stageMaze() {
  for (let i = 0; i < MAZES.length; i++) {
    hud.hidden = true;
    showPanel(`<h2>MAZE ${i + 1} / 3</h2><p class="muted">Guide the cursor from the light circle to the red circle. Do not touch the walls.</p>`);
    await wait(2600);
    hidePanel();
    const ok = await runMaze(MAZES[i], i);
    if (!ok) return false;
    showPanel(`<h2>MAZE ${i + 1} CLEARED</h2>`);
    await wait(1600);
  }
  return true;
}

let turnVideoReady = null;
function loadTurnVideo() {
  if (!turnVideoReady) {
    turnVideoReady = fetch('img/turn.mp4').then(r => r.ok ? r.blob() : null).then(b => {
      if (b) $('#rlglVid').src = URL.createObjectURL(b);
    }).catch(() => {});
  }
  return turnVideoReady;
}

const TURN = { backStart: 0.1, backEnd: 4.8, turnStart: 4.95, front: 5.6, frontStart: 6.0, frontEnd: 9.8 };

function stageClownGame() {
  return new Promise(res => {
    const wrap = $('#rlgl'), v = $('#rlglVid'), bar = $('#rlglBar div'), info = $('#rlglInfo');
    let phase = 'back', progress = 0, timer = rand(2.5, 4.5), watchT = 0, holding = false, last = performance.now(), stepT = 0, raf = 0;
    const down = e => { if (e.code === 'Space') { e.preventDefault(); holding = true; } };
    const up = e => { if (e.code === 'Space') holding = false; };
    const pdown = e => { if (!e.target.closest('button')) holding = true; };
    const pup = () => { holding = false; };
    const seek = t => { v.currentTime = t; const pr = v.play(); if (pr) pr.catch(() => {}); };
    const finish = ok => {
      cancelAnimationFrame(raf);
      removeEventListener('keydown', down); removeEventListener('keyup', up);
      crt.removeEventListener('pointerdown', pdown); removeEventListener('pointerup', pup); removeEventListener('pointercancel', pup);
      res(ok);
    };
    const step = now => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (phase === 'back') {
        if (v.currentTime >= TURN.backEnd) seek(TURN.backStart);
        if (holding) {
          progress = Math.min(1, progress + dt / 14);
          stepT -= dt;
          if (stepT <= 0 && AC && runStepBuf) {
            const src = AC.createBufferSource(), g = AC.createGain();
            src.buffer = runStepBuf; src.playbackRate.value = rand(0.85, 0.95);
            g.gain.value = 1.4; src.connect(g); g.connect(master); src.start();
            stepT = 0.5;
          }
        }
        timer -= dt;
        if (progress >= 1) {
          phase = 'won';
          wrap.hidden = true;
          showPanel('<h2>You touched him.</h2>');
          if (AC) cueWhisper(1);
          setTimeout(() => { hidePanel(); v.pause(); finish(true); }, 2600);
          return;
        }
        if (timer <= 0) { phase = 'turning'; watchT = 0; seek(TURN.turnStart); }
      } else if (phase === 'turning') {
        watchT += dt;
        if (v.currentTime >= TURN.front || watchT > 1.2) { phase = 'watching'; watchT = 0; timer = rand(1.6, 3.2); }
      } else if (phase === 'watching') {
        if (v.currentTime >= TURN.frontEnd) seek(TURN.frontStart);
        watchT += dt;
        if (holding && watchT > 0.25) {
          phase = 'caught';
          v.pause();
          wrap.hidden = true;
          game.failMsg = 'He saw you move.';
          finish(false);
          return;
        }
        timer -= dt;
        if (timer <= 0) {
          phase = 'back';
          blackout = true;
          setTimeout(() => { blackout = false; }, 150);
          seek(TURN.backStart);
          timer = rand(2, 4.5) * (1 - 0.5 * progress);
        }
      }
      const sc = 0.42 + 0.78 * progress;
      v.style.transform = `translateX(-50%) scale(${sc.toFixed(3)})`;
      bar.style.width = (progress * 100).toFixed(1) + '%';
      info.textContent = phase === 'back' ? 'HOLD SPACE OR PRESS THE SCREEN TO WALK' : 'DO NOT MOVE';
      info.classList.toggle('stop', phase !== 'back');
      raf = requestAnimationFrame(step);
    };
    addEventListener('keydown', down); addEventListener('keyup', up);
    crt.addEventListener('pointerdown', pdown); addEventListener('pointerup', pup); addEventListener('pointercancel', pup);
    wrap.hidden = false;
    seek(TURN.backStart);
    raf = requestAnimationFrame(step);
  });
}

async function stageClown() {
  hud.hidden = true;
  showPanel(`<h2>ONE, TWO, THREE, CLOWN</h2><p class="muted">He wants to play. Walk to him while his back is turned. When he turns around, do not move.</p>`);
  await wait(4000);
  hidePanel();
  const ok = await stageClownGame();
  $('#rlgl').hidden = true;
  return ok;
}

const STAGES = [
  { name: 'QUESTIONS', run: stageQuestions },
  { name: 'ACTIONS', run: stageActions },
  { name: 'STORY', run: stageStory },
  { name: 'REACTION TEST', run: stageReaction },
  { name: 'MAZE', run: stageMaze },
  { name: 'CLOWN GAME', run: stageClown }
];

function setIntroClown(on) {
  const v = $('#introClown');
  v.hidden = !on;
  panel.classList.toggle('withSide', on);
  if (on) { const pr = v.play(); if (pr) pr.catch(() => {}); } else v.pause();
}

async function runGame(startStage = 0) {
  setIntroClown(false);
  initAudio();
  hidePanel();
  showPanel('<h2>LOADING</h2>');
  await Promise.all([loadImages(), loadScream(), loadHeart(), loadAmbient(), loadSteps(), loadRunStep(), loadTurnVideo()]);
  game = { startStage, stage: startStage + 1, scareLevel: 3 + Math.floor(Math.random() * 6), hits: 0, misses: 0, falses: 0, rtSum: 0, lv: null, paused: false, level: 1, chain: 0, caught: false };
  startDrone();
  for (let i = startStage; i < STAGES.length; i++) {
    game.stage = i + 1;
    hud.hidden = true;
    showPanel(`<h2>STAGE ${i + 1}</h2><p class="muted">${STAGES[i].name}</p>`);
    await wait(2200);
    hidePanel();
    const ok = await STAGES[i].run();
    if (!ok) {
      stopDrone();
      await wait(250);
      await jumpscare();
      showEnd(false);
      return;
    }
  }
  stopDrone();
  showEnd(true);
}

function showEnd(won) {
  const avg = game.hits ? (game.rtSum / game.hits / 1000).toFixed(3) + ' S' : '-';
  const head = won
    ? `<h1>ASSESSMENT COMPLETE</h1><p>You responded to every stimulus through all ${LEVELS} levels. Your results have been recorded.</p>`
    : `<h1>TERMINATED</h1><p class="warn">${game.failMsg || (game.caught ? `It reached you at level ${game.level}.` : `Too many errors at level ${game.level}.`)}</p>`;
  showPanel(`${head}
    <div class="stats">
      <span>STIMULI CAUGHT</span><span>${game.hits}</span>
      <span>MISSED</span><span>${game.misses}</span>
      <span>FALSE RESPONSES</span><span>${game.falses}</span>
      <span>AVG RESPONSE</span><span>${avg}</span>
    </div>
    <button id="again" type="button">RUN AGAIN</button>`);
  $('#again').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); runGame(game.startStage); });
}

function showIntro() {
  hud.hidden = true;
  setIntroClown(true);
  showPanel(`<h1>STATIC RESPONSE</h1>
    <p>This program measures how fast you react to things you do not expect. Each level lasts over a minute and moves faster than the one before.</p>
    <ol>
      <li>Sit in a dark room.</li>
      <li>Wear headphones and turn the volume up.</li>
      <li>Press SPACE, or tap the screen, the moment you hear a sound or see an image.</li>
      <li>Do not press when nothing is there.</li>
      <li>Three errors in one level end the session.</li>
      <li>Do not look away from the screen.</li>
    </ol>
    <p class="warn">CONTAINS LOUD SOUNDS AND SUDDEN FRIGHTENING IMAGES</p>
    <button id="begin" type="button">BEGIN</button>
    <div class="stagepick"><span class="muted">TEST ONE STAGE</span>${STAGES.map((st, i) => `<button type="button" class="small" data-stage="${i}">${i + 1}. ${st.name}</button>`).join('')}</div>`);
  $('#begin').addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); runGame(0); });
  panel.querySelectorAll('[data-stage]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); e.currentTarget.blur(); runGame(+e.currentTarget.dataset.stage); }));
}

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (game && game.lv) { e.preventDefault(); if (!e.repeat) press(); }
  }
});
crt.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (game && game.lv) { e.preventDefault(); press(); }
});

let introAudioStarted = false;
async function startIntroAudio() {
  if (introAudioStarted) return;
  introAudioStarted = true;
  initAudio();
  showIntro();
  await Promise.all([loadHeart(), loadAmbient()]);
  startDrone();
}
addEventListener('pointerdown', startIntroAudio);
addEventListener('keydown', startIntroAudio);

function showGate() {
  hud.hidden = true;
  showPanel(`<h1>STATIC RESPONSE</h1>
    <p class="warn">PUT ON HEADPHONES. THIS PROGRAM USES SOUND.</p>
    <button id="enter" type="button">CLICK TO ENTER</button>`);
}

showGate();
</script>
